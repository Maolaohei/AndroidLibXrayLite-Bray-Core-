name: Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Golang
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    # 获取最新 release 对应的 commit hash
    - name: Get latest Bray-Core release commit
      id: bray_latest
      run: |
        TAG=$(curl -s https://api.github.com/repos/Maolaohei/Bray-Core/releases/latest | jq -r .tag_name)
        COMMIT=$(curl -s https://api.github.com/repos/Maolaohei/Bray-Core/git/ref/tags/$TAG | jq -r .object.sha)
        echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        echo "Latest tag: $TAG, commit: $COMMIT"

    # 强制更新依赖：删除旧条目，清理缓存，用 commit hash 重新添加
    - name: Update Bray-Core to latest release commit
      run: |
        go mod edit -droprequire github.com/Maolaohei/Bray-Core
        go clean -modcache
        go get github.com/Maolaohei/Bray-Core@${{ steps.bray_latest.outputs.commit }}
        go mod tidy

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH=$PATH:~/go/bin
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Build
      run: |
         mkdir -p assets data
         bash gen_assets.sh download
         cp -v data/*.dat assets/
         gomobile init
         go mod tidy
         gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
 
    - name: Upload build artifacts
      if: github.event.inputs.release_tag == ''
      uses: actions/upload-artifact@v7
      with:
        name: libv2ray
        path: |
          ${{ github.workspace }}/libv2ray*r

    - name: Upload AndroidLibXrayLite to release
      if: github.event.inputs.release_tag != ''
      uses: svenstaro/upload-release-action@v2
      with:
        file: ./libv2ray*r
        tag: ${{ github.event.inputs.release_tag }}
        file_glob: true
