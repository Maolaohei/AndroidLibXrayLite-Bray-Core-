name: Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    # ========== 新增：授予写入权限 ==========
    permissions:
      contents: write

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Golang
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    # 获取最新 Bray-Core release 对应的 commit hash
    - name: Get latest Bray-Core release commit
      id: bray_latest
      run: |
        TAG=$(curl -s https://api.github.com/repos/Maolaohei/Bray-Core/releases/latest | jq -r .tag_name)
        COMMIT=$(curl -s https://api.github.com/repos/Maolaohei/Bray-Core/git/ref/tags/$TAG | jq -r .object.sha)
        echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        echo "Latest tag: $TAG, commit: $COMMIT"

    # 修复模块路径不匹配的问题
    - name: Fix module paths and replace with fork
      run: |
        # 1. 将所有源代码中的 import 路径从 Bray-Core 改为 xray-core
        find . -name "*.go" -type f -exec sed -i 's|github.com/Maolaohei/Bray-Core|github.com/xtls/xray-core|g' {} \;
        
        # 2. 删除 go.mod 中旧的 require 行
        go mod edit -droprequire github.com/Maolaohei/Bray-Core || true
        
        # 3. 添加 replace 指令，将 xray-core 指向 Bray-Core 的最新 commit
        go mod edit -replace github.com/xtls/xray-core=github.com/Maolaohei/Bray-Core@${{ steps.bray_latest.outputs.commit }}
        
        # 4. 清理缓存并重新整理依赖
        go clean -modcache
        go mod tidy

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH=$PATH:~/go/bin
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Build
      run: |
         mkdir -p assets data
         bash gen_assets.sh download
         cp -v data/*.dat assets/
         gomobile init
         go mod tidy
         gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
 
    - name: Upload build artifacts
      if: github.event.inputs.release_tag == ''
      uses: actions/upload-artifact@v7
      with:
        name: libv2ray
        path: |
          ${{ github.workspace }}/libv2ray*r

    - name: Upload AndroidLibXrayLite to release
      if: github.event.inputs.release_tag != ''
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}   # 明确使用 GITHUB_TOKEN
        file: ./libv2ray*r
        tag: ${{ github.event.inputs.release_tag }}
        file_glob: true
        overwrite: true                            # 如果 tag 已存在则覆盖
